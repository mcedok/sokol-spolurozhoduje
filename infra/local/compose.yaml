name: sokol-spolurozhoduje-test

services:
  postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: sokol_test
      POSTGRES_USER: sokol
      POSTGRES_PASSWORD: local-only-password
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sokol -d sokol_test"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - sokol_pg_data:/var/lib/postgresql/data
    networks: [conversion-backend, test-host]

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.36.0
    command: azurite-blob --blobHost 0.0.0.0 --loose --skipApiVersionCheck --disableTelemetry --location /data
    ports:
      - "127.0.0.1:10000:10000"
    healthcheck:
      test: ["CMD", "node", "-e", "const s=require('net').connect(10000,'127.0.0.1');s.on('connect',()=>{s.end();process.exit(0)});s.on('error',()=>process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - sokol_azurite_data:/data
    networks: [conversion-backend, test-host]

  clamav:
    image: clamav/clamav:stable-debian
    ports:
      - "127.0.0.1:3310:3310"
    healthcheck:
      test: ["CMD", "/usr/local/bin/clamdcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 30
    networks: [conversion-backend, test-host]

  conversion-worker:
    profiles: ["conversion"]
    build:
      context: ../..
      dockerfile: worker/Dockerfile
      target: runtime
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/sokol_test
      DATABASE_USER: sokol
      DATABASE_PASSWORD: local-only-password
      AZURE_STORAGE_CONNECTION_STRING: DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;
      CLAMAV_HOST: clamav
      CLAMAV_PORT: "3310"
      WORKER_ID: local-worker
    depends_on:
      postgres:
        condition: service_healthy
      azurite:
        condition: service_healthy
      clamav:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:mode=1777
      - /tmp/conversion:mode=0700,uid=10001,gid=10001
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks: [conversion-backend]
    restart: unless-stopped

volumes:
  sokol_pg_data:
  sokol_azurite_data:

networks:
  conversion-backend:
    internal: true
  test-host:
