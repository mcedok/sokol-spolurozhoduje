name: sokol-spolurozhoduje-test

services:
  postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: sokol_test
      POSTGRES_USER: sokol
      POSTGRES_PASSWORD: local-only-password
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sokol -d sokol_test"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - sokol_pg_data:/var/lib/postgresql/data

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.36.0
    command: azurite-blob --blobHost 0.0.0.0 --loose --skipApiVersionCheck --disableTelemetry --location /data
    ports:
      - "127.0.0.1:10000:10000"
    healthcheck:
      test: ["CMD", "node", "-e", "const s=require('net').connect(10000,'127.0.0.1');s.on('connect',()=>{s.end();process.exit(0)});s.on('error',()=>process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - sokol_azurite_data:/data

  clamav:
    image: clamav/clamav:stable-debian
    ports:
      - "127.0.0.1:3310:3310"
    healthcheck:
      test: ["CMD", "/usr/local/bin/clamdcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 30

volumes:
  sokol_pg_data:
  sokol_azurite_data:
